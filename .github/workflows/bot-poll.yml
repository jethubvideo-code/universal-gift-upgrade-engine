name: Bot poll
on:
  schedule:
    - cron: "*/5 * * * *" # short getUpdates cycle; commands + business_connection updates
  workflow_dispatch:

permissions:
  contents: write

# getUpdates is exclusive: never two overlapping pollers.
concurrency:
  group: bot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Poll bot updates (one short cycle)
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "vars.BOT_TOKEN not set yet — bot poll skipped (monitoring still runs via engine-cycle)"
            exit 0
          fi
          node bot/bot.js
        env:
          TEST_MODE: "false"
          DB_BACKEND: "file"
          TRANSPORT: "botapi"
          BOT_TOKEN: ${{ vars.BOT_TOKEN }}
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
          BOT_POLL_SECONDS: "50"
      - name: Commit bot state (if changed)
        run: |
          git config user.name "upgrade-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state || true
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "bot: state update $(date -u +%FT%TZ)"
            git pull --rebase -q origin main || (sleep 10 && git pull --rebase -q origin main)
            git push
          fi
