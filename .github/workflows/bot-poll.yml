name: Bot poll
on:
  schedule:
    - cron: "*/2 * * * *" # short getUpdates cycle; commands + business_connection updates (fast: new targets reach the engine within minutes)
  workflow_dispatch:

permissions:
  contents: write

# getUpdates is exclusive: never two overlapping pollers.
concurrency:
  group: bot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Poll bot updates (one short cycle)
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "vars.BOT_TOKEN not set yet — bot poll skipped (monitoring still runs via engine-cycle)"
            exit 0
          fi
          node bot/bot.js
        env:
          TEST_MODE: "false"
          DB_BACKEND: "file"
          TRANSPORT: "botapi"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MINIAPP_URL: ${{ vars.MINIAPP_URL }}
          BOT_POLL_SECONDS: "50"
      - name: Build static site (GitHub Pages)
        run: node scripts/build-site.js
        env:
          DB_BACKEND: "file"
      - name: Commit bot state (if changed)
        run: |
          git config user.name "upgrade-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state docs || true
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "bot: state + site update $(date -u +%FT%TZ)"
            git pull --rebase -q -X theirs origin main || { sleep 10; git rebase --abort 2>/dev/null || true; git pull --rebase -q -X theirs origin main; }
            git push
          fi
