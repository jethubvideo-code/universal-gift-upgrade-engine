name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: find src bot api test -name '*.js' -exec node --check {} +
      - name: Tests (incl. TEST MODE simulator)
        run: node --test test/
      - name: Performance tests
        run: node --test test/perf/
      - name: Secret scan (no credentials in code/frontend)
        run: |
          echo "Scanning for leaked secrets..."
          FOUND=0
          PATTERNS='[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk_live_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY|1[A-Za-z0-9]{200,}'
          if grep -rEn "$PATTERNS" --include='*.js' --include='*.html' --include='*.json' --include='*.yml' --exclude-dir=node_modules . ; then
            echo "::error::Potential secret found in repository files!"
            FOUND=1
          fi
          if grep -rEn "BOT_TOKEN\s*=\s*['\"][0-9]" --include='*.js' --include='*.html' . --exclude-dir=node_modules ; then
            echo "::error::Hardcoded bot token found!"
            FOUND=1
          fi
          exit $FOUND
