name: Deploy Mini App to Pages

# GitHub Pages hosts the Mini App frontend for free. Only static files are
# deployed — NO secrets, NO user sessions, NO API credentials can ever end up
# in the frontend (frontend reads the public snapshot miniapp-data.json).

on:
  push:
    branches: [main]
    paths:
      - 'miniapp/**'
      - 'docs/miniapp-data.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages bundle
        run: |
          mkdir -p _pages
          cp miniapp/index.html miniapp/app.js miniapp/style.css _pages/
          touch _pages/.nojekyll
          if [ -f docs/miniapp-data.json ]; then cp docs/miniapp-data.json _pages/; else
            echo '{"snapshot_at":null,"collections":[],"state":[],"targets":[],"events":[]}' > _pages/miniapp-data.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
