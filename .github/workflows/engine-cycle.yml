name: Engine cycle
on:
  schedule:
    - cron: "*/5 * * * *" # one full monitor cycle, state committed back (*/5: semi-automatic mode needs fast hot-target detection)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (GramJS for the MTProto transport)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Run one engine cycle
        run: node src/index.js --once
        env:
          RUN_ONCE: "1"
          TEST_MODE: "false"
          DB_BACKEND: "file"
          # Flip to full-auto MTProto with repo VARIABLES (no code change):
          #   Settings → Secrets and variables → Actions → Variables:
          #     TRANSPORT = mtproto   (after the QR login workflow succeeded)
          #     ENGINE_MODE = live    (careful: real Star spending)
          TRANSPORT: ${{ vars.TRANSPORT || 'botapi' }}
          MODE: ${{ vars.ENGINE_MODE || 'dry-run' }}
          COLLECTION_SOURCE: "gifttracker"
          GIFTTRACKER_DATA_URL: "https://raw.githubusercontent.com/jethubvideo-code/gifttracker-bot/main/docs/gifts.json"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BUSINESS_CONNECTION_ID: ${{ vars.BUSINESS_CONNECTION_ID }}
          # MTProto transport (used only when TRANSPORT=mtproto):
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      - name: Build static site (GitHub Pages)
        run: node scripts/build-site.js
        env:
          DB_BACKEND: "file"
      - name: Commit engine state (if changed)
        run: |
          git config user.name "upgrade-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state docs || true
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "engine: state + site update $(date -u +%FT%TZ)"
            git pull --rebase -q -X theirs origin main || { sleep 10; git rebase --abort 2>/dev/null || true; git pull --rebase -q -X theirs origin main; }
            git push
          fi
