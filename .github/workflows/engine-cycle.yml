name: Engine cycle
on:
  schedule:
    - cron: "*/15 * * * *" # one full monitor cycle, state committed back
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run one engine cycle
        run: node src/index.js --once
        env:
          RUN_ONCE: "1"
          TEST_MODE: "false"
          DB_BACKEND: "file"
          TRANSPORT: "botapi"
          COLLECTION_SOURCE: "gifttracker"
          GIFTTRACKER_DATA_URL: "https://jethubvideo-code.github.io/gifttracker-bot/gifts.json"
          BOT_TOKEN: ${{ vars.BOT_TOKEN }}
          BUSINESS_CONNECTION_ID: ${{ vars.BUSINESS_CONNECTION_ID }}
      - name: Commit engine state (if changed)
        run: |
          git config user.name "upgrade-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state || true
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "engine: state update $(date -u +%FT%TZ)"
            git pull --rebase -q origin main || (sleep 10 && git pull --rebase -q origin main)
            git push
          fi
