name: MTProto login (guided)
# The bot (@lvlonebot) walks the owner through login in their Telegram chat:
# phone number -> login code -> 2FA password (if set). Replies are read via
# getUpdates ONLY from the owner's chat id. The encrypted session is
# committed to data/state/telegram_sessions.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *" # picks up /login requests from ANY user (queue in data/state)

permissions:
  contents: write

# NEVER cancel an in-progress login: the user may be mid-flow answering
# the bot's phone/code/2FA questions.
concurrency:
  group: mtproto-login-guided
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Guided QR-free login (owner answers the bot in Telegram)
        run: node scripts/login-mtproto-guided.js
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID }}
          DB_BACKEND: file
      - name: Commit encrypted session
        if: success()
        run: |
          git config user.name "upgrade-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state/telegram_sessions.json data/state/login_requests.json
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "mtproto: session/login-queue state update"
            git pull --rebase -q -X theirs origin main || true
            git push
          fi
