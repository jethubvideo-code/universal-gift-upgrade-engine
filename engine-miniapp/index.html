<!DOCTYPE html>
<html lang="ru">
<head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gift Engine · Таргеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a0e; --panel:#14121a; --panel2:#1a1722; --line:#2a2536;
  --gold:#e8c35a; --gold2:#f5d87e; --text:#f2eef7; --dim:#9b93ad; --dim2:#6b6480;
  --green:#4ade80; --red:#f87171; --blue:#7aa2f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden;
  background-image:radial-gradient(60% 40% at 50% 0%,rgba(232,195,90,.07),transparent 70%)}
.tg{font-family:'Unbounded',sans-serif}
#app{max-width:520px;margin:0 auto;padding:0 14px 90px}
.hdr{padding:16px 2px 12px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 75%,transparent);z-index:20}
.hdr .row{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:19px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2s infinite}
.logo .dot.warn{background:var(--gold);box-shadow:0 0 12px var(--gold)}
@keyframes pulse{50%{opacity:.5}}
.hdr .st{font-size:11.5px;color:var(--dim)}
.tabs{display:flex;gap:8px;margin:12px 0 4px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.tab.on{background:linear-gradient(180deg,#2b2340,#221c33);color:var(--gold2);border-color:#4a3c66}
.search{margin:10px 0 12px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);
  padding:12px 16px 12px 40px;font-size:14.5px;font-family:inherit;outline:none}
.search input:focus{border-color:#4a3c66}
.search svg{position:absolute;left:13px;top:12px;opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.985)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.card .nm{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.card .nx{font-size:12px;color:var(--gold);font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:4px;background:#0e0c13;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8f7a2e,var(--gold));transition:width .5s}
.bar i.hot{background:linear-gradient(90deg,#b3541e,#f59e0b)}
.meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--dim)}
.hot-badge{display:inline-block;font-size:10px;font-weight:700;color:#0b0a0e;background:var(--gold);
  padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:1px;letter-spacing:.5px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,4,8,.72);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:520px;background:var(--panel2);border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;padding:20px 18px 26px;transform:translateY(30px);transition:.22s}
.sheet.open .box{transform:translateY(0)}
.grab{width:42px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-family:'Unbounded';font-size:17px;margin-bottom:5px}
.sheet .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);
  padding:13px 14px;font-size:16px;font-weight:700;font-family:inherit;outline:none}
.fld input:focus{border-color:var(--gold)}
.hint{font-size:11.5px;color:var(--dim2);margin-top:5px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Unbounded';font-size:14px;font-weight:700;
  cursor:pointer;letter-spacing:.3px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;box-shadow:0 6px 24px rgba(232,195,90,.25)}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);margin-top:9px;font-family:'Manrope';font-weight:600}
.trow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.trow .r1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.trow .col{font-weight:700;font-size:14px}
.trow .num{font-family:'Unbounded';font-size:15px;color:var(--gold2)}
.trow .r2{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:.4px}
.chip.WATCHING{background:#1d2b3d;color:#8db8ff}
.chip.PREDICTED{background:#33261a;color:#f5b76b}
.chip.HOT_TARGET{background:#3d1d1d;color:#ff8f8f;animation:pulse 1.2s infinite}
.chip.UPGRADING{background:#33261a;color:#f5b76b;animation:pulse 1.2s infinite}
.chip.COMPLETED{background:#16331f;color:#6ee394}
.chip.FAILED{background:#331616;color:#ff8f8f}
.empty{text-align:center;padding:52px 20px;color:var(--dim2)}
.empty .big{font-size:34px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);background:#211d2e;border:1px solid #443a5e;
  color:var(--text);padding:13px 20px;border-radius:13px;font-size:13.5px;font-weight:600;z-index:99;
  opacity:0;transition:.25s;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:#2c5e3f}.toast.err{border-color:#5e2c2c}
.note{background:#161422;border:1px solid #3a3050;border-radius:14px;padding:14px;margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.55}
.note b{color:var(--gold2)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="row">
      <div class="logo tg"><span class="dot" id="pulse"></span>GIFT&nbsp;ENGINE</div>
      <div class="st" id="upd">загрузка…</div>
    </div>
    <div class="tabs">
      <div class="tab on" id="tab-col">Коллекции</div>
      <div class="tab" id="tab-my">Мои таргеты</div>
    </div>
  </div>

  <div id="view-col">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Поиск коллекции…" autocomplete="off">
    </div>
    <div id="cols"><div class="empty"><p><span class="spin"></span><br><br>Загружаю коллекции…</p></div></div>
  </div>

  <div id="view-my" style="display:none">
    <div id="mine"><div class="empty"><p><span class="spin"></span></p></div></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="box">
      <div class="grab"></div>
      <h3 id="sh-title" class="tg">—</h3>
      <div class="sub" id="sh-sub">—</div>
      <div class="fld">
        <label>Номер подарка-таргета</label>
        <input id="sh-num" type="number" min="1" inputmode="numeric" placeholder="номер">
        <div class="hint" id="sh-hint"></div>
      </div>
      <div class="fld">
        <label>Лимит цены апгрейда, Stars (необязательно)</label>
        <input id="sh-stars" type="number" min="0" inputmode="numeric" placeholder="без лимита">
        <div class="hint">Если апгрейд будет стоить дороже — движок не купит и сообщит тебе.</div>
      </div>
      <button class="btn gold" id="sh-go">Активировать через бота</button>
      <button class="btn ghost" id="sh-close">Отмена</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* GitHub-only architecture: static site on GitHub Pages.
   READ:  state.json (public collections snapshot) + targets/<sha256(user_id)>.json (my targets)
   WRITE: deep link to the bot -> bot command creates the target. No external backend. */
const BASE = location.pathname.replace(/\/[^/]*$/, '/');
const STATE_URL = BASE + 'state.json';
const TARGETS_URL = BASE + 'targets/';
const DEEPLINK = 'https://t.me/lvlonebot?start=';
/* LIVE layer: the app polls the tracker's public JSON DIRECTLY from the
   browser (CORS *), so counter numbers move in near real time (every 20s)
   without waiting for the engine workflows to rebuild state.json (5-15 min).
   state.json remains the source for titles/engine meta; live numbers win. */
const LIVE_URL = 'https://raw.githubusercontent.com/jethubvideo-code/gifttracker-bot/main/docs/gifts.json';
const LIVE_POLL_MS = 5000; // owner asked for per-second feel; 5s is the fastest sane rate against a static JSON file
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) tg.setHeaderColor('#0b0a0e'); if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0a0e'); }
let COLS = [], cur = null, userHash = null, lastUpdate = null;
let LIVE = new Map();        // slug -> {issued, total} (direct tracker data)
let SAMPLES = new Map();      // slug -> [{t, issued}] client-side history (30 min)
let liveUpdated = null;      // tracker's own "updated" timestamp

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, cls) { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (cls || ''); setTimeout(() => t.className = 'toast', 3400); }
function fmtAgo(iso) { if (!iso) return '—'; const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return 'только что'; if (m < 60) return m + ' мин назад'; return Math.round(m / 60) + ' ч назад'; }
function openUrl(url) { if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); }

async function computeUserHash() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (!u || !u.id) return null;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(u.id)));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return null; }
}

async function loadState() {
  try {
    const r = await fetch(STATE_URL, { cache: 'no-store' });
    if (!r.ok) throw 0;
    const d = await r.json();
    lastUpdate = d.updated_at; COLS = d.collections || [];
    mergeLive();
    $('upd').textContent = 'обновлено ' + fmtAgo(d.updated_at);
    const dot = $('pulse');
    if (d.engine && d.engine.business_linked) dot.classList.remove('warn'); else dot.classList.add('warn');
    renderCols();
  } catch (e) {
    $('cols').innerHTML = '<div class="empty"><div class="big">⚡</div><p>Не удалось загрузить данные.<br>Попробуй обновить через минуту.</p></div>';
  }
}
/* ---- LIVE: direct tracker polling (near real-time numbers) ---- */
function mergeLive() {
  for (const c of COLS) {
    const lv = LIVE.get(c.collection_id); if (!lv) continue;
    c.issued = lv.issued; c.total = lv.total; c.next = lv.issued < lv.total ? lv.issued + 1 : null;
  }
}
function ratePerMin(cid) {
  const arr = SAMPLES.get(cid); if (!arr || arr.length < 2) return 0;
  const a = arr[0], b = arr[arr.length - 1];
  const dtMin = (b.t - a.t) / 60000;
  if (dtMin < 0.5) return 0;
  return Math.max(0, (b.issued - a.issued) / dtMin);
}
function etaText(cid, remaining) {
  const r = ratePerMin(cid);
  if (r <= 0 || remaining <= 0) return '';
  const mins = remaining / r;
  if (mins > 60 * 24) return '';
  return mins < 1 ? 'финиш < 1 мин' : 'финиш ≈ ' + (mins < 60 ? Math.round(mins) + ' мин' : (mins / 60).toFixed(1) + ' ч');
}
async function loadLive() {
  try {
    const r = await fetch(LIVE_URL, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    liveUpdated = d.updated || null;
    const now = Date.now();
    for (const g of (d.gifts || [])) {
      const issued = Number(g.issued || 0), total = Number(g.total || 0);
      const prev = LIVE.get(g.slug);
      LIVE.set(g.slug, { issued, total });
      let arr = SAMPLES.get(g.slug);
      if (!arr) { arr = []; SAMPLES.set(g.slug, arr); }
      if (!prev || prev.issued !== issued) arr.push({ t: now, issued });
      while (arr.length && now - arr[0].t > 30 * 60000) arr.shift();
    }
    mergeLive();
    const staleMin = liveUpdated ? Math.round((Date.now() - new Date(liveUpdated)) / 60000) : null;
    $('upd').textContent = staleMin == null ? '' :
      (staleMin <= 1 ? 'LIVE · только что' :
       staleMin < 60 ? 'источник: ' + staleMin + ' мин назад' :
       'источник: ' + Math.round(staleMin / 60) + ' ч назад');
    $('pulse').classList.toggle('warn', staleMin != null && staleMin > 10);
    renderCols();
    if (cur && $('sheet').classList.contains('open')) refreshSheetLive();
  } catch (e) { /* tracker unreachable — state.json values stay on screen */ }
}
function refreshSheetLive() {
  if (!cur) return;
  const total = cur.total || 0, iss = cur.issued || 0, next = (iss < total) ? iss + 1 : null;
  $('sh-sub').textContent = `Выдано ${iss.toLocaleString('ru')} из ${total.toLocaleString('ru')}` + (ratePerMin(cur.collection_id) > 0 ? ' · ' + ratePerMin(cur.collection_id).toFixed(1) + '/мин' : '');
  $('sh-hint').textContent = next ? ('Ближайший ожидаемый номер: #' + next + (etaText(cur.collection_id, total - iss) ? ' · ' + etaText(cur.collection_id, total - iss) : '')) : '';
}
function renderCols() {
  const q = $('q').value.trim().toLowerCase();
  const list = q ? COLS.filter(c => (c.title || c.collection_id).toLowerCase().includes(q)) : COLS;
  const close = list.map(c => {
    const total = c.total || 0, iss = c.issued || 0;
    const next = (iss < total) ? iss + 1 : null;
    const pct = total ? Math.min(100, Math.round(iss / total * 100)) : 0;
    const hot = total && total - iss <= Math.max(3, Math.round(total * 0.01));
    return `<div class="card" data-c="${esc(c.collection_id)}">
      <div class="top"><span class="nm">${esc(c.title || c.collection_id)}${hot ? '<span class="hot-badge">ФИНИШ</span>' : ''}</span>
      <span class="nx">${next ? 'следующий #' + next : 'выпуск завершён'}</span></div>
      <div class="bar"><i class="${hot ? 'hot' : ''}" style="width:${pct}%"></i></div>
      <div class="meta"><span>выдано ${iss.toLocaleString('ru')} из ${total.toLocaleString('ru')}</span><span>${(() => { const r = ratePerMin(c.collection_id); return r > 0 ? r.toFixed(1) + '/мин · ' : (etaText(c.collection_id, total - iss) || pct + '%'); })()}</span></div>
    </div>`;
  }).join('');
  $('cols').innerHTML = close || '<div class="empty"><p>Ничего не найдено.</p></div>';
}
function openSheet(cid) {
  cur = COLS.find(c => c.collection_id === cid); if (!cur) return;
  const total = cur.total || 0, iss = cur.issued || 0, next = (iss < total) ? iss + 1 : null;
  $('sh-title').textContent = cur.title || cur.collection_id;
  $('sh-sub').textContent = `Выдано ${iss.toLocaleString('ru')} из ${total.toLocaleString('ru')}`;
  $('sh-num').value = next || ''; $('sh-hint').textContent = next ? ('Ближайший ожидаемый номер: #' + next) : '';
  $('sh-stars').value = ''; $('sheet').classList.add('open');
}
function submitTarget() {
  if (!cur) return;
  const num = parseInt($('sh-num').value, 10);
  if (!num || num < 1) { toast('Введите корректный номер', 'err'); return; }
  const stars = $('sh-stars').value.trim();
  const payload = 'add_' + cur.collection_id + '_' + num + (stars ? '_' + stars : '');
  $('sheet').classList.remove('open');
  toast('Открываю бота — нажми «Start», и таргет активируется', 'ok');
  openUrl(DEEPLINK + payload);
}
const STATUS_RU = { WATCHING: 'Слежу', PREDICTED: 'Цель близко', HOT_TARGET: 'Горячий таргет', UPGRADING: 'Апгрейд', COMPLETED: 'Выполнен', FAILED: 'Не удалось' };
async function loadMine() {
  if (!userHash) {
    $('mine').innerHTML = '<div class="empty"><div class="big">🤖</div><p>Твои таргеты появятся здесь.<br>Открой приложение из бота <b>@lvlonebot</b> (кнопка меню).</p></div>';
    return;
  }
  try {
    const r = await fetch(TARGETS_URL + userHash + '.json', { cache: 'no-store' });
    const d = await r.json();
    if (!d.targets || !d.targets.length) {
      $('mine').innerHTML = '<div class="empty"><div class="big">🎯</div><p>Пока нет таргетов.<br>Открой вкладку «Коллекции», выбери подарок<br>и задай номер, который нужно словить.</p><div class="note">Движок следит за выдачей всех коллекций каждые 15 минут. Когда номер станет близко — бот напишет тебе первым.</div></div>';
      return;
    }
    $('mine').innerHTML = d.targets.map(t => `<div class="trow">
      <div class="r1"><span class="col">${esc(t.title || t.collection_id)}</span><span class="num">#${t.target_number}</span></div>
      <div class="r2"><span class="chip ${t.status}">${STATUS_RU[t.status] || t.status}</span>
      ${t.max_stars ? '<span>лимит ' + t.max_stars + ' ★</span>' : ''}
      ${t.auto_upgrade ? '<span>авто-апгрейд</span>' : ''}
      <span>${fmtAgo(t.updated_at)}</span></div>
    </div>`).join('') + '<div class="note">Статусы: <b>Слежу</b> — движок мониторит выпуск. <b>Горячий таргет</b> — номер на подходе. Уведомления придут от @lvlonebot.</div>';
  } catch (e) {
    $('mine').innerHTML = '<div class="empty"><p>Не удалось загрузить таргеты. Открой приложение из бота и попробуй снова.</p></div>';
  }
}
function switchTab(which) {
  $('tab-col').classList.toggle('on', which === 'col');
  $('tab-my').classList.toggle('on', which === 'my');
  $('view-col').style.display = which === 'col' ? '' : 'none';
  $('view-my').style.display = which === 'my' ? '' : 'none';
  if (which === 'my') loadMine();
}
$('tab-col').onclick = () => switchTab('col');
$('tab-my').onclick = () => switchTab('my');
$('q').oninput = renderCols;
$('cols').onclick = e => { const c = e.target.closest('.card'); if (c) openSheet(c.dataset.c); };
$('sh-close').onclick = () => $('sheet').classList.remove('open');
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').classList.remove('open'); };
$('sh-go').onclick = submitTarget;
computeUserHash().then(h => { userHash = h; });
loadState();
setInterval(loadState, 60000); // engine meta + titles (targets live in docs/targets/)
loadLive();
setInterval(loadLive, LIVE_POLL_MS); // LIVE numbers every 20s, direct from the tracker
</script>
</body>
</html>
